name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npm test
      - name: Tipos y build
        run: npm run build
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador (iPhone simulado)
        run: npm run e2e
