name: Publicar en GitHub Pages

# Publica la app en https://<usuario>.github.io/<repositorio>/ en cada envío a main.
# Requisito, una sola vez: Settings, Pages, Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      # Antes de publicar, la app compilada en un iPhone simulado: arranque, pestañas, gestos y archivos de esquemas anteriores
      - name: Build para las pruebas de navegador
        run: npm run build
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador
        run: npm run e2e
      - name: Build para la ruta del repositorio
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages sirve 404.html en las rutas que no existen: así funcionan los enlaces directos
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
